name: Nomad Travel iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Validate Swift Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Display Swift Version
        run: swift --version

      - name: Build NomadTravel Package
        run: swift build -v

      - name: Run Swift Package Tests
        run: swift test || true
